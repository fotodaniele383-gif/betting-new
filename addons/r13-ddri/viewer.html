<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline';"> <title>BettingApp R13 — Revisione locale</title><style>
body{background:#101922;color:#e9eef3;font:15px/1.55 system-ui,sans-serif;margin:0 auto;max-width:950px;padding:30px}h1{font-size:1.6rem}label{display:inline-block;background:#263d54;padding:12px 18px;border-radius:8px;cursor:pointer}input{display:none}.hint{color:#a5b9c6}#status{border:1px solid #47617a;border-radius:8px;padding:18px;margin-top:18px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #2a3c4b;text-align:left}code{color:#9fd5ff;overflow-wrap:anywhere}li{margin-bottom:8px}.warn{color:#ffce7d}
</style></head><body><h1>BettingApp R13 — Audit & Decision Integrity</h1><p class="hint">Visualizzatore offline di report R13 in JSON. Nessuna connessione, nessuna lettura automatica del database, nessuna autorizzazione monetaria.</p><label for="file">Seleziona un report R13 (.json)</label><input id="file" type="file" accept=".json,application/json"><section id="status" aria-live="polite">Scegli un file dalla cartella <code>%LOCALAPPDATA%\BettingApp_R13_Review</code>.</section><script>
'use strict'; const f=document.getElementById('file'),status=document.getElementById('status');function el(tag,txt,parent){const o=document.createElement(tag);o.textContent=txt;parent.appendChild(o);return o;}f.addEventListener('change',async()=>{status.replaceChildren();try{const obj=JSON.parse(await f.files[0].text());el('h2','Rapporto: '+(obj.version||'Non identificato'),status);el('p','Stato: '+(obj.status||obj.mode||'Non disponibile'),status).className='warn';if(typeof obj.dbUnchanged==='boolean')el('p','Database invariato: '+obj.dbUnchanged,status);if(typeof obj.unresolvedCount==='number')el('p','Questioni R12 aperte: '+obj.unresolvedCount,status);if(obj.r12?.groups){const t=el('table','',status);const hd=el('tr','',t);for(const label of ['Sport','Esaminati','Stake zero'])el('th',label,hd);for(const [k,v] of Object.entries(obj.r12.groups)){const tr=el('tr','',t);for(const x of [k,v.records,v.zero])el('td',String(x),tr)}}if(Array.isArray(obj.unresolved)){el('h3','Questioni aperte',status);const ul=el('ul','',status);for(const i of obj.unresolved)el('li',i.code,ul)}if(Array.isArray(obj.markets)){el('h3','Mercati (nessuno autorizza stake)',status);const ul=el('ul','',status);for(const m of obj.markets)el('li',m.id+' | '+m.status+' | '+m.reasons.join(', '),ul)}if(Array.isArray(obj.scenarioResults)){el('h3','Simulazione minimax teorica',status);el('p','Budget '+obj.budgetEuro+' EUR; stake '+obj.stakesEuro.join(' + ')+' EUR; peggiore '+obj.worstNetEuro+' EUR',status);const ul=el('ul','',status);for(const s of obj.scenarioResults)el('li',s.scenario+': '+s.netEuro+' EUR',ul)}}catch(e){el('p','Impossibile aprire il report: '+e.message,status)}});
</script></body></html>
